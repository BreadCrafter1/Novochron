name: Android build

# Assumes Novochron.zip (containing the top-level "Novochron/" project folder) is committed at the repo
# root. Change NOVOCHRON_ZIP below if you named or placed it differently.
#
# Gemini API key: add it once as a repo secret so it's built in without ever being committed in plain
# text (Google auto-revokes a key it finds exposed in a public repo) -
#   Repo Settings > Secrets and variables > Actions > New repository secret
#   Name:  GEMINI_API_KEY
#   Value: <your key>
# The "Build debug APK" step below passes it through as an env var, which app/build.gradle.kts already
# picks up (same lookup Store.kt/BuildConfig uses for a local build) - no other change needed here.
#
# GitHub Personal Access Token: same idea, so vault/sync/msg/the terminal are already logged in on
# every build this workflow produces - no "gh login" on the phone -
#   Repo Settings > Secrets and variables > Actions > New repository secret
#   Name:  GH_PAT
#   Value: <a token from github.com/settings/tokens - fine-grained with Contents read/write on
#          whatever repo(s) you'll use for vault/sync/msg, or a classic token with the "repo" scope>
# (Named GH_PAT rather than GITHUB_PAT because GitHub reserves every secret name starting with
# GITHUB_ for its own auto-injected values - it rejects a repo secret with that prefix outright.
# The "Build debug APK" step below still exposes it to Gradle as GITHUB_PAT, which is what
# app/build.gradle.kts actually looks for, so nothing else needs to change.)
# GitHub itself also secret-scans and auto-revokes a PAT it finds committed in plain text, same as
# Google does for the Gemini key above - keep it in this repo secret only, never in a committed file.
# See README > GitHub setup > "Baking in a token" for more.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  NOVOCHRON_ZIP: Novochron.zip
  PROJECT_DIR: Novochron

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip the project
        run: |
          test -f "$NOVOCHRON_ZIP" || { echo "::error::$NOVOCHRON_ZIP not found at repo root"; exit 1; }
          unzip -o "$NOVOCHRON_ZIP" -d .
          test -f "$PROJECT_DIR/settings.gradle.kts" || { echo "::error::$PROJECT_DIR/settings.gradle.kts missing after unzip - check the zip's folder name"; exit 1; }
          ls -la "$PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest runners ship with an Android SDK already installed (platforms, build-tools,
      # licenses) - no separate SDK-install action needed, and the old android-actions/setup-android
      # action fails on current runners because it tries to install the removed legacy "tools" package.

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The zip only ships gradle-wrapper.properties (no gradlew/gradlew.bat/gradle-wrapper.jar), so
      # regenerate the wrapper before using ./gradlew. IMPORTANT: plain `gradle wrapper` does NOT read
      # the version out of the committed gradle-wrapper.properties - it defaults to whatever Gradle is
      # already installed on the runner (currently 9.7.x on ubuntu-latest), which is newer than this
      # project's AGP version supports. So the exact version is pulled out of the committed properties
      # file first and passed explicitly with --gradle-version, which keeps the build on the Gradle
      # version this project actually declares (8.7) no matter what's preinstalled on the runner.
      - name: Bootstrap Gradle wrapper if missing
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f gradlew ]; then
            GRADLE_VER=$(grep -oP '(?<=gradle-)[0-9][0-9.]*(?=-(bin|all)\.zip)' gradle/wrapper/gradle-wrapper.properties)
            test -n "$GRADLE_VER" || { echo "::error::couldn't read a Gradle version out of gradle/wrapper/gradle-wrapper.properties"; exit 1; }
            echo "Generating wrapper for Gradle $GRADLE_VER (as declared in gradle-wrapper.properties)"
            gradle wrapper --gradle-version "$GRADLE_VER"
          fi
          chmod +x gradlew

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_PAT: ${{ secrets.GH_PAT }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: novochron-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
