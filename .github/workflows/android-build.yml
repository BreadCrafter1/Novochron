name: Android build

# Assumes Atlas.zip (containing the top-level "Atlas/" project folder) is committed at the repo
# root. Change ATLAS_ZIP below if you named or placed it differently.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  ATLAS_ZIP: Atlas.zip
  PROJECT_DIR: Atlas

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip the project
        run: |
          test -f "$ATLAS_ZIP" || { echo "::error::$ATLAS_ZIP not found at repo root"; exit 1; }
          unzip -o "$ATLAS_ZIP" -d .
          test -f "$PROJECT_DIR/settings.gradle.kts" || { echo "::error::$PROJECT_DIR/settings.gradle.kts missing after unzip - check the zip's folder name"; exit 1; }
          ls -la "$PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest runners ship with an Android SDK already installed (platforms, build-tools,
      # licenses) - no separate SDK-install action needed, and the old android-actions/setup-android
      # action fails on current runners because it tries to install the removed legacy "tools" package.

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The zip only ships gradle-wrapper.properties (no gradlew/gradlew.bat/gradle-wrapper.jar),
      # so regenerate the wrapper from that file's declared version before using ./gradlew.
      - name: Bootstrap Gradle wrapper if missing
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: novochron-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
